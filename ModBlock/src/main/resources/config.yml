# ===================================
#      ModBlock - блокировка модов
# ===================================
# Ловит моды, которые регистрируют сетевой канал при заходе на сервер
# (так делает большинство миникарт/x-ray/фрикам/макро-модов).
# Это не стопроцентная защита - моды без сетевых каналов не поймает.

enabled: true

# kick - кикать при обнаружении
# alert - только сообщать персоналу (право skcode.alerts), не кикать
action: kick

# Список ключевых слов - если название канала СОДЕРЖИТ любое из них
# (без учёта регистра), игрок считается поймавшимся.
blocked-channels:
  - "freecam"
  - "xray"
  - "xaeroworldmap"
  - "xaerominimap"
  - "litematica"
  - "baritone"
  - "wurst"
  - "meteor"
  - "impact"

# Если true - логирует в консоль ВСЕ каналы всех игроков при заходе
# (не только совпавшие с blocked-channels). Полезно, чтобы посмотреть,
# что реально шлют игроки, и подобрать точные ключевые слова.
log-all-channels: false
